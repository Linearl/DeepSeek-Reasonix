version: 0.1.0
registry:
  id: ll-workflow-base-actions
  description: >-
    ll 系列技能共享基础动作注册表。所有动作都要求具备稳定目的、明确输入输出、
    可验证证据策略；所有路径解析都优先经过 directory-layout 配置；当现有动作不足时，
    可先使用 custom.described_action 试运行。
actions:
  - id: route.resolve_workflow
    kind: base
    description: 根据 route-registry 中的 short_name、alias 与意图提示，为当前用户请求选择目标 workflow。
    inputs:
      - name: routeRegistryRef
        required: true
      - name: userRequest
        required: true
      - name: explicitRoute
        required: false
    outputs:
      - name: route
      - name: workflowPath
      - name: directoryProfileRef
      - name: resourceBundles
    preconditions:
      - route registry 可访问
    side_effects: []
    default_on_fail: needs_user_confirmation
    evidence_policy: routing_decision

  - id: resource.load_bundle
    kind: base
    description: 根据 resource-bundles 配置装载指定 bundle 的模板、脚本、配置与参考文档路径。
    inputs:
      - name: resourceBundlesRef
        required: true
      - name: bundleIds
        required: true
    outputs:
      - name: loadedBundles
      - name: includedPaths
    preconditions:
      - resource bundle registry 可访问
    side_effects: []
    default_on_fail: block
    evidence_policy: bundle_manifest

  - id: layout.load_directory_profile
    kind: base
    description: 读取 directory-layout 配置文件，结合 workspaceRoot / targetDevDir / version 解析逻辑槽位。
    inputs:
      - name: directoryProfileRef
        required: true
      - name: workspaceRoot
        required: true
      - name: targetDevDir
        required: true
      - name: version
        required: false
    outputs:
      - name: layout
      - name: slots
      - name: semantics
    preconditions:
      - directoryProfileRef 指向可读取的目录结构配置文件
    side_effects: []
    default_on_fail: block
    evidence_policy: layout_snapshot

  - id: layout.resolve_slot
    kind: base
    description: >-
      【底层槽位解析】根据目录结构配置解析单个**底层槽位**（如 task_todo_root）的具体路径。
      仅返回物理路径，不做语义映射。适用于需要直接访问配置层 slot 的场景。
    inputs:
      - name: layout
        required: true
      - name: slot
        required: true
        description: 底层槽位名（如 task_todo_root）
    outputs:
      - name: resolvedPath
    preconditions:
      - layout 已加载
      - slot 必须是 layout.slots 中已定义的底层槽位
    side_effects: []
    default_on_fail: block
    evidence_policy: slot_resolution
    usage_boundary: >-
      与 layout.resolve_semantic 互斥：
      - 需要解析**业务语义目录**（如 todo / done / changelog）→ 用 resolve_semantic
      - 需要解析**底层 slot**（如 task_todo_root / docs_root）→ 用 resolve_slot

  - id: layout.resolve_semantic
    kind: base
    description: >-
      【业务语义解析】根据目录结构配置解析**业务语义目录名**（如 todo / done / changelog），
      返回对应物理路径及底层 slot 名。适用于业务层使用，自动映射到配置层 slot。
    inputs:
      - name: layout
        required: true
      - name: semanticName
        required: true
        description: 业务语义名（如 todo / done / changelog）
    outputs:
      - name: resolvedPath
      - name: slotName
    preconditions:
      - layout 已加载且 semantics 已定义
    side_effects: []
    default_on_fail: block
    evidence_policy: semantic_resolution
    usage_boundary: >-
      与 layout.resolve_slot 互斥：
      - 业务层使用（如 workflow 步骤）→ 用 resolve_semantic
      - 配置层使用（如 layout 内部维护）→ 用 resolve_slot

  - id: context.resolve_target_version
    kind: base
    description: 解析用户显式目录或自动识别当前最高 dev_xx，输出 targetDevDir 与 version。
    inputs:
      - name: userTarget
        required: false
      - name: workspaceRoot
        required: true
    outputs:
      - name: targetDevDir
      - name: version
    preconditions:
      - workspaceRoot 可访问
    side_effects: []
    default_on_fail: needs_user_confirmation
    evidence_policy: summary_only

  - id: context.load_governance_context
    kind: base
    description: 读取 docs 规范、任务规则、技能约束与仓库治理口径，不做任何修改。
    inputs:
      - name: targetDevDir
        required: true
      - name: layout
        required: false
    outputs:
      - name: docRules
      - name: repoRules
    preconditions:
      - targetDevDir 已解析
    side_effects: []
    default_on_fail: block
    evidence_policy: rule_snapshot

  - id: governance.validate_state_sync
    kind: base
    description: 校验需求状态与任务状态是否匹配；发现错配时输出阻断原因与差异清单。
    inputs:
      - name: governanceRef
        required: true
      - name: layout
        required: true
      - name: taskPath
        required: false
      - name: requirementPath
        required: false
    outputs:
      - name: isConsistent
      - name: mismatchItems
      - name: blockingReason
      - name: syncReportPath
    preconditions:
      - governanceRef 指向可读取的治理配置
      - layout 已加载
    side_effects: []
    default_on_fail: block
    evidence_policy: state_sync_report

  - id: handoff.ensure_ticket
    kind: base
    description: 生成或校验统一交接工单，确保关键字段完整后才允许跨 route 或跨阶段交接。
    inputs:
      - name: governanceRef
        required: true
      - name: taskPath
        required: true
      - name: route
        required: true
      - name: ticketType
        required: false
    outputs:
      - name: handoffTicketPath
      - name: missingFields
      - name: isComplete
    preconditions:
      - taskPath 已存在
    side_effects:
      - 可能创建或更新 handoff ticket
    default_on_fail: block
    evidence_policy: handoff_ticket

  - id: context.scan_todo_topics
    kind: base
    description: 根据目录结构配置中的 todo 语义槽位扫描当前版本待办专题，输出待办清单、推荐候选与完成度摘要。
    inputs:
      - name: layout
        required: true
      - name: semanticName
        required: false
    outputs:
      - name: todoTopics
      - name: recommendedTopics
      - name: progressSummary
    preconditions:
      - layout 已加载
    side_effects: []
    default_on_fail: block
    evidence_policy: topic_list

  - id: interaction.ask_questions_gate
    kind: base
    description: 按预定义门控模板发起 ask_questions，并将用户答案结构化写入上下文。
    inputs:
      - name: questionSet
        required: true
      - name: mode
        required: false
      - name: recommendedOptions
        required: false
      - name: gateTemplatePath
        required: false
        description: 门控问题模板路径（v0.2.2 新增）；默认从 route-registry.route.req.template_files 推断
    outputs:
      - name: answers
      - name: gateResult
    preconditions:
      - questionSet 已准备
    side_effects:
      - 可能暂停流程等待用户输入
    default_on_fail: use_default_or_block
    evidence_policy: answer_log

  - id: task.resolve_identity
    kind: base
    description: 结合目录结构配置生成或确认 taskId、taskFolder、需求编号与任务包路径。
    inputs:
      - name: reqId
        required: false
      - name: title
        required: true
      - name: version
        required: true
      - name: layout
        required: true
    outputs:
      - name: taskId
      - name: taskFolder
      - name: taskPath
    preconditions:
      - version 已解析
    side_effects: []
    default_on_fail: block
    evidence_policy: task_identity_snapshot

  - id: requirement.analyze_request
    kind: base
    description: 将原始自然语言诉求转为结构化需求要点，并给出 openQuestions。
    inputs:
      - name: userRequest
        required: true
      - name: context
        required: false
    outputs:
      - name: requirementDraft
      - name: openQuestions
    preconditions:
      - 已加载治理上下文
    side_effects: []
    default_on_fail: block
    evidence_policy: requirement_outline

  - id: requirement.classify_type
    kind: base
    description: >-
      根据用户请求内容自动分类需求类型（feature/bugfix/refactor/ops/docs/test），
      并确定编号段（1xxx-9xxx）。支持项目配置的自定义分类映射。
    inputs:
      - name: userRequest
        required: true
      - name: categoryMapping
        required: false
        description: 项目配置的分类映射表
    outputs:
      - name: reqType
      - name: categoryCode
      - name: categoryLabel
      - name: confidence
    preconditions: []
    side_effects: []
    default_on_fail: use_default
    evidence_policy: classification_result

  - id: requirement.assess_complexity
    kind: base
    description: >-
      评估需求复杂度（simple/medium/complex），基于需求规模、影响范围、技术风险等维度。
      复杂度决定后续流程：是否跳过澄清、是否需要 design 文档。
    inputs:
      - name: requirementDraft
        required: true
      - name: complexityRules
        required: false
        description: 项目配置的复杂度规则
    outputs:
      - name: complexity
      - name: skipClarification
      - name: skipDesign
      - name: maxGateRounds
    preconditions:
      - requirementDraft 已生成
    side_effects: []
    default_on_fail: use_default
    evidence_policy: complexity_assessment

  - id: requirement.create_inactive_doc
    kind: base
    description: 在目录结构配置映射的 inactive requirement 槽位创建需求文档并写入最小结构化内容。
    inputs:
      - name: requirementDraft
        required: true
      - name: versionHint
        required: false
      - name: layout
        required: true
    outputs:
      - name: requirementPath
    preconditions:
      - requirementDraft 已生成
    side_effects:
      - 写入 layout.semantics.inactive_requirement 对应目录
    default_on_fail: block
    evidence_policy: created_file

  - id: requirement.compute_overrides
    kind: base
    description: >-
      根据复杂度评估、项目配置（category_mapping / complexity_rules / skip_clarification_keywords / skip_design_complexity）
      与用户 override，计算 req 路由的 4 个控制开关：skipClarification、skipDesign、effectiveMaxGateRounds、unresolvedCount。
      是 v0.2.2 替换 custom.described_action apply_complexity_overrides 的结构化版本。
    inputs:
      - name: complexityAssessment
        required: true
        description: requirement.assess_complexity 的输出
      - name: userOverride
        required: false
        description: 用户显式传入的覆盖（skipClarificationOverride / skipDesign / 等）
      - name: categoryMapping
        required: false
        description: 项目配置的分类映射表
      - name: complexityRules
        required: false
        description: 项目配置的复杂度判定规则
      - name: skipClarificationKeywords
        required: false
        description: 项目配置的"跳过澄清"关键词列表
      - name: skipDesignComplexity
        required: false
        description: 项目配置的"跳过 design"的复杂度等级列表
      - name: openQuestionsCount
        required: false
        description: 当前 openQuestions 数量（用于初始化 unresolvedCount）
    outputs:
      - name: skipClarification
      - name: skipDesign
      - name: effectiveMaxGateRounds
      - name: unresolvedCount
      - name: appliedKeywordMatches
        description: 命中的关键词列表（用于 decision_log）
    preconditions:
      - complexityAssessment 已生成
    side_effects: []
    default_on_fail: block
    evidence_policy: overrides_snapshot
    usage_boundary: >-
      互斥约束：与 flow.requirement_activate 不应在同一 workflow 中同时调用，
      避免同时改 task 路径与 overrides。

  - id: requirement.refine_ears
    kind: base
    description: >-
      用 latest_answers 压缩 openQuestions 并提炼 EARS（Easy Approach to Requirements Syntax）风格验收条目。
      是 v0.2.2 替换 custom.described_action refine_acceptance_by_description 的结构化版本。
      关键约束：openQuestions 必须真实压缩，unresolvedCount 必须真实回写，不允许静默丢未决项。
    inputs:
      - name: requirementDraft
        required: true
      - name: openQuestions
        required: true
      - name: latestAnswers
        required: true
        description: interaction.ask_questions_gate 的输出
      - name: earsTemplate
        required: false
        description: EARS 验收条目模板（可选，默认使用系统模板）
    outputs:
      - name: refinedRequirementDraft
      - name: openQuestions
        description: 压缩后的 openQuestions（数量必须 <= 输入）
      - name: unresolvedCount
      - name: earsChecklist
        description: EARS 风格验收条目清单
    preconditions:
      - latestAnswers 已生成
    side_effects: []
    default_on_fail: continue_with_warning
    evidence_policy: refinement_diff

  - id: task.compute_path_hint
    kind: base
    description: >-
      基于 version + reqId + title 计算任务包路径提示（taskPathHint）。
      **不创建任何目录**，仅返回路径字符串。
      适用于 req 路由 b_input_intake 阶段提前给出 taskPath 提示，
      供中间 phase 的 evidence/governance 调用引用，避免延后到 d_write_requirements 才拿到 taskPath。
    inputs:
      - name: version
        required: true
      - name: reqId
        required: true
      - name: title
        required: true
      - name: layout
        required: true
    outputs:
      - name: taskPathHint
        description: 任务包目录的完整路径（不创建）
    preconditions:
      - layout 已加载
    side_effects:
      - 仅返回路径字符串，不做任何写盘
    default_on_fail: block
    evidence_policy: path_hint

  - id: task.activate_requirement
    kind: base
    description: >-
      将需求文档从 inactive requirement 语义槽位激活到 todo 语义槽位，并生成任务包路径。
      **内部会自动调用 task.resolve_identity** 来生成 taskId/taskFolder/taskPath，
      因此 composite workflow 不需要把两者并列声明。
    inputs:
      - name: requirementPath
        required: true
      - name: layout
        required: true
      - name: title
        required: false
        description: 可选；若提供则与 task.resolve_identity 配合生成 taskFolder
    outputs:
      - name: taskId
      - name: taskFolder
      - name: taskPath
      - name: workingReqPath
    preconditions:
      - requirementPath 存在
      - layout 已加载（用于解析 todo/inactive 语义槽位）
    side_effects:
      - 内部调用 task.resolve_identity 计算 taskId/taskPath
      - 迁移或复制需求文档到 todo 目录
    default_on_fail: block
    evidence_policy: path_change
    usage_boundary: >-
      与 task.resolve_identity 的关系：
      - task.resolve_identity：**纯计算**动作，只生成 taskId/taskFolder/taskPath 元数据，不写盘
      - task.activate_requirement：**副作用动作**，内部调用 task.resolve_identity 后再迁移需求文档
      - composite workflow 中只需声明 task.activate_requirement；只有在需要单独获取身份信息（如预演）时才调用 task.resolve_identity

  - id: task.freeze_original_copy
    kind: base
    description: 创建 -original 冻结副本并标注不可再改写语义。
    inputs:
      - name: workingReqPath
        required: true
    outputs:
      - name: originalReqPath
    preconditions:
      - workingReqPath 已存在
    side_effects:
      - 写入 -original 副本
    default_on_fail: block
    evidence_policy: created_file

  - id: task.load_package_spec
    kind: base
    description: >-
      在创建任务包之前加载并理解六件套规范文档，返回结构化的规范要求供下游校验步骤引用。
      读取的规范文档：
      1. docs/1.task/B.todo/任务包六件套构成-编号分类规则-自动归档机制.md — 六件套构成、编号规则、归档机制
      2. skills/ll-workflow-core/routes/dev/references/task-package-naming.md — 目录命名和文件命名规范
      关键规则摘要：
      - REQ 文件必须命名为 REQ-{reqId}.md 和 REQ-{reqId}-original.md（含编号）
      - 必须包含 run_result.json（JSON 格式，非 YAML frontmatter）
      - 目录名格式：v{version}-r{reqId}-p{priority}-{slug}
    inputs:
      - name: workspaceRoot
        required: true
      - name: layout
        required: false
    outputs:
      - name: specLoaded
      - name: namingRules
      - name: requiredFiles
      - name: dirNameFormat
    preconditions:
      - 任务包规范文档存在且可读取
    side_effects: []
    default_on_fail: block
    evidence_policy: loaded_references

  - id: task.validate_package_spec
    kind: base
    description: >-
      验证任务包命名是否符合规范（在创建文件之前执行）。
      检查项：
      1. 目录名格式：v{version}-r{reqId}-p{priority}-{slug}
      2. REQ 文件命名：必须为 REQ-{reqId}.md 和 REQ-{reqId}-original.md（含编号）
      3. 规范文档已读取（specReference 输入存在）
    inputs:
      - name: taskPath
        required: true
      - name: specReference
        required: true
    outputs:
      - name: validationResult
      - name: violations
    preconditions:
      - taskPath 已存在
      - specReference 已读取
    side_effects: []
    default_on_fail: block
    evidence_policy: validation_report

  - id: task.ensure_package_scaffold
    kind: base
    description: >-
      确保六件套任务包文件齐备。
      必需文件：README.md、REQ-{id}.md、REQ-{id}-original.md、tasks.md、run_result.json
      可选文件：design.md、decision_log.md（简单任务可省略）
      命名规则：REQ 文件必须包含编号后缀（如 REQ-3086.md，不是 REQ.md）
    inputs:
      - name: taskPath
        required: true
      - name: layout
        required: false
      - name: templateRefs
        required: false
      - name: reqId
        required: true
    outputs:
      - name: packageFiles
    preconditions:
      - taskPath 已存在
      - reqId 已确定
    side_effects:
      - 创建缺失文件
      - 验证 REQ 文件命名包含 reqId 后缀
    default_on_fail: block
    evidence_policy: created_files

  - id: state.update_task_status
    kind: base
    description: >-
      更新任务状态、阶段状态、完成摘要与原因说明。
      v0.2.2 扩展：新增可选 `statusAxis` input（默认 `task`），支持写入 requirement 轴状态。
      `task` 轴：写 task 文档的 status 字段（旧行为）。
      `requirement` 轴：写 requirement 文档的 status 字段（与 task 轴独立）。
      两轴独立写入，互不影响；与 workflow-governance.yaml 的 allowed_pairs 配合实现双轴一致性。
    inputs:
      - name: taskPath
        required: true
      - name: newStatus
        required: true
      - name: statusAxis
        required: false
        default: task
        description: 'task | requirement；默认 task（向后兼容）'
      - name: reason
        required: false
      - name: layout
        required: false
    outputs:
      - name: statusRecord
    preconditions:
      - taskPath 已存在
    side_effects:
      - 修改任务文档或状态字段
    default_on_fail: block
    evidence_policy: status_diff

  - id: decision.record
    kind: base
    description: 将关键选择、默认决策、回退原因写入 decision_log 或结果上下文。
    inputs:
      - name: decisionPoint
        required: true
      - name: choice
        required: true
      - name: reason
        required: false
    outputs:
      - name: decisionEntry
    preconditions: []
    side_effects:
      - 写入 decision_log
    default_on_fail: continue_with_warning
    evidence_policy: appended_log

  - id: implementation.apply_changes
    kind: base
    description: 在限定范围内完成代码或文档改动，并返回 changedFiles。
    inputs:
      - name: taskPath
        required: true
      - name: scope
        required: true
      - name: constraints
        required: false
      - name: layout
        required: false
    outputs:
      - name: changedFiles
      - name: implementationNotes
    preconditions:
      - 已确认修改范围
    side_effects:
      - 修改工作区文件
    default_on_fail: block
    evidence_policy: changed_files

  - id: validation.execute
    kind: base
    description: 执行测试、规则检查或人工验证，回答是否通过以及证据是什么。
    inputs:
      - name: validationPlan
        required: true
      - name: changedFiles
        required: false
    outputs:
      - name: validationResult
      - name: evidence
    preconditions:
      - 验证计划已准备
    side_effects: []
    default_on_fail: block
    evidence_policy: validation_result

  - id: quality.route_gate
    kind: base
    description: 根据治理配置评估质量门与异常分级，输出 continue / pause / block 决策。
    inputs:
      - name: governanceRef
        required: true
      - name: route
        required: true
      - name: validationResult
        required: true
      - name: auditTrigger
        required: false
      - name: riskLevel
        required: false
    outputs:
      - name: gateDecision
      - name: severity
      - name: nextAction
    preconditions:
      - validationResult 已生成
    side_effects: []
    default_on_fail: block
    evidence_policy: quality_gate_report

  - id: evidence.collect
    kind: base
    description: 汇总命令输出、日志、截图、文件链接等证据材料，输出统一的 evidenceBundle。
    inputs:
      - name: validationResult
        required: false
      - name: artifacts
        required: false
      - name: route
        required: false
    outputs:
      - name: evidenceBundle
    preconditions: []
    side_effects:
      - 仅在内存中聚合，不直接产出最终文件
    default_on_fail: continue_with_warning
    evidence_policy: evidence_bundle
    usage_boundary: >-
      顺序约束：必须**先 collect 后 emit_dual_format**。
      collect 只负责"汇总 → evidenceBundle"，
      不应同时承担"写入最终 markdown/json 文档"职责，
      否则会和 emit_dual_format 重复产出文件。

  - id: evidence.emit_dual_format
    kind: base
    description: 将 evidenceBundle 输出为 Markdown 与 JSON 双格式文件，并回填周报/发布摘要引用信息。
    inputs:
      - name: governanceRef
        required: true
      - name: route
        required: true
      - name: taskPath
        required: false
      - name: evidenceBundle
        required: true
    outputs:
      - name: evidenceMarkdownPath
      - name: evidenceJsonPath
    preconditions:
      - evidenceBundle 已生成（由 evidence.collect 提供）
    side_effects:
      - 写入 markdown/json 证据文件
    default_on_fail: continue_with_warning
    evidence_policy: dual_evidence
    usage_boundary: >-
      顺序约束：必须在 evidence.collect 之后调用。
      emit_dual_format 只做"格式序列化 → 落盘"，不做证据收集。
      如果 workflow 只需要一次性产出，建议合并为 custom.described_action，
      仅当 dual format 有差异化复用价值时才拆为两个动作。

  - id: audit.verify_backflow
    kind: base
    description: 在审计收口前检查任务进度、需求风险备注与 changelog 三处回写是否齐备。
    inputs:
      - name: governanceRef
        required: true
      - name: layout
        required: true
      - name: taskPath
        required: false
    outputs:
      - name: backflowStatus
      - name: missingWritebacks
      - name: blockingReason
    preconditions:
      - layout 已加载
    side_effects: []
    default_on_fail: block
    evidence_policy: backflow_report

  - id: feedback.enqueue_learning
    kind: base
    description: 根据高价值触发条件，把经验条目加入周度回灌清单并保留追溯引用。
    inputs:
      - name: governanceRef
        required: true
      - name: taskPath
        required: false
      - name: decisionRefs
        required: false
      - name: runResultPath
        required: false
      - name: triggerSignals
        required: false
    outputs:
      - name: weeklyBackflowPath
      - name: queuedItemId
    preconditions: []
    side_effects:
      - 可能更新 weekly backlog 文档
    default_on_fail: continue_with_warning
    evidence_policy: learning_queue

  - id: docs.sync_governance_entries
    kind: base
    description: >-
      同步 docs 体系的**治理入口**文档（docs/README.md、docs/INDEX.md 等），
      使其与最新目录结构、任务包索引和周报/版本收口状态一致。
      **不再触达 requirements.md**——该清单由 docs.maintain_requirements_md 单独负责，
      两个动作严格分离。
    inputs:
      - name: layout
        required: true
      - name: syncProfile
        required: false
      - name: taskPath
        required: false
      - name: statusRecord
        required: false
    outputs:
      - name: syncedFiles
    preconditions:
      - 已加载 layout，且 syncProfile 能映射到具体目标
    side_effects:
      - 更新 docs/README.md、docs/INDEX.md 等治理入口文档
    default_on_fail: block
    evidence_policy: synced_files
    usage_boundary: >-
      与 docs.maintain_requirements_md 严格互斥：
      - sync_governance_entries → docs/README.md + docs/INDEX.md（治理入口）
      - maintain_requirements_md   → requirements.md（需求清单）
      任何 workflow 步骤不得同时调用两者去改写同一份文件。
      当 task 状态需要回写时，先调 maintain_requirements_md 更新清单，再调本动作更新入口链接。

  - id: archive.move_task_package
    kind: base
    description: 根据目录结构配置将任务包迁移到 done 或其他生命周期语义槽位。
    inputs:
      - name: taskPath
        required: true
      - name: layout
        required: true
      - name: archiveSlot
        required: true
    outputs:
      - name: archivePath
    preconditions:
      - 归档条件已满足
    side_effects:
      - 迁移目录或文件
    default_on_fail: block
    evidence_policy: path_change

  - id: audit.scan_codebase
    kind: base
    description: 依据全量或增量范围执行代码审计扫描，输出问题清单。
    inputs:
      - name: auditScope
        required: true
      - name: fileSet
        required: false
    outputs:
      - name: findings
      - name: codebaseMetrics
    preconditions:
      - 审计范围已确认
    side_effects: []
    default_on_fail: block
    evidence_policy: scan_report

  - id: audit.cross_review_findings
    kind: base
    description: 对审计结果执行多轮证据校正、误报排查与行号修正。
    inputs:
      - name: findings
        required: true
      - name: reviewRounds
        required: true
    outputs:
      - name: reviewedFindings
      - name: reviewSummary
    preconditions:
      - findings 已生成
    side_effects: []
    default_on_fail: block
    evidence_policy: review_diff

  - id: docs.bootstrap_structure
    kind: base
    description: 根据目录结构配置中的 docs_root 槽位创建 docs 骨架、预置模板并生成 bootstrap 结果清单。
    inputs:
      - name: layout
        required: true
      - name: targetSlot
        required: false
      - name: bootstrapMode
        required: false
    outputs:
      - name: bootstrapResult
    preconditions:
      - 目标目录可写
    side_effects:
      - 创建 docs 目录与模板文件
    default_on_fail: block
    evidence_policy: created_dirs

  - id: docs.maintain_requirements_md
    kind: base
    description: >-
      requirements.md 一站式维护动作。**原 docs.upgrade_run_results 与 docs.sync_requirements_md 的合并体**。
      mode 控制维护策略：
        - `upgrade`：扫描 todo/done 任务包，补齐 run_result.json 的元数据（中文标题、来源层、备注、日期）
        - `sync`：扫描所有任务包的 run_result.json，刷新 requirements.md 的全量清单和状态看板
        - `upgrade_then_sync`（默认）：先 upgrade 再 sync，确保元数据与文档同步一致
    inputs:
      - name: layout
        required: true
      - name: mode
        required: false
        default: upgrade_then_sync
        description: 维护策略，可选 upgrade | sync | upgrade_then_sync
      - name: apply
        required: false
        default: false
        description: 默认 false（dry-run 报告），true 时真正落盘
      - name: filterDirs
        required: false
        description: 仅 mode=upgrade 时生效；限制扫描的子目录集
    outputs:
      - name: mode
      - name: upgradeReport
      - name: syncReport
      - name: packageCount
      - name: improvedCount
      - name: syncedFiles
    preconditions:
      - layout 已加载且 task 语义槽位可访问
      - mode=sync 或 upgrade_then_sync 时 requirements.md 必须存在
    side_effects:
      - 升级模式：更新 run_result.json 字段
      - 同步模式：更新 requirements.md 第 3、4 章（可通过 --backup 参数创建 .bak 备份，默认不备份）
    default_on_fail: block
    evidence_policy: maintenance_report
    usage_boundary: >-
      - 仅在 version 收口（flow.version_closeout）或 task 归档（flow.task_archive_done）时使用
      - 与 docs.sync_governance_entries 严格互斥：
        maintain_requirements_md → requirements.md（需求清单）
        sync_governance_entries  → docs/README.md + docs/INDEX.md（治理入口）
      - 调用方不必再分别 upgrade + sync，按 mode 一次性完成

  - id: docs.import_documents
    kind: base
    description: 根据目录结构配置把历史文档导入指定语义槽位，并生成冲突处理与导入日志。
    inputs:
      - name: sourceDir
        required: true
      - name: layout
        required: true
      - name: targetSlot
        required: false
      - name: importStrategy
        required: false
    outputs:
      - name: importReport
      - name: unresolvedMappings
    preconditions:
      - 来源目录与目标 docs 目录可访问
    side_effects:
      - 复制或迁移文档到目标 docs
    default_on_fail: block
    evidence_policy: import_log

  - id: config.manage_project
    kind: base
    description: >-
      【统一项目配置读写】通过 mode 参数切换加载（read）或写入（write）`.ll-workflow.yaml`。
      替代原 config.load_project_config + config.write_project_config 的双动作模式，
      避免配置读写路径不一致或文件被读写竞争覆盖。
    inputs:
      - name: mode
        required: true
        enum: [read, write]
      - name: workspaceRoot
        required: true
      - name: configFileName
        required: false
        default: ".ll-workflow.yaml"
      - name: projectConfig
        required: false
        description: 仅 write 模式需要；read 模式下若缺省则返回当前配置
    outputs:
      - name: projectConfig
        description: read 模式返回的项目配置
      - name: configExists
        description: 仅 read 模式
      - name: configPath
      - name: writeResult
        description: 仅 write 模式
    preconditions:
      - workspaceRoot 已确定
      - write 模式下必须提供 projectConfig
    side_effects:
      - write 模式会创建或覆盖 .ll-workflow.yaml
    default_on_fail: read 模式=use_default；write 模式=block
    evidence_policy: project_config_io
    usage_boundary: >-
      取代 config.load_project_config 与 config.write_project_config。
      统一通过 mode 切换。所有需要读写项目配置的复合动作均应迁移到本动作。
      与 config.interactive_setup 严格互斥：
      - manage_project → CRUD/读写 .ll-workflow.yaml
      - interactive_setup → 通过 AI 对话**生成**配置内容（再交给 manage_project.write 落盘）
      与 config.merge_profiles 严格互斥：
      - manage_project → 配置文件本身的 IO
      - merge_profiles → 合并逻辑（将 projectConfig 覆盖到 baseProfile）

  - id: config.interactive_setup
    kind: base
    description: >-
      交互式项目配置设置。通过与用户对话，收集项目基本信息、目录映射偏好和工作流行为参数，
      生成完整的项目配置文件内容。
    inputs:
      - name: workspaceRoot
        required: true
      - name: existingConfig
        required: false
      - name: baseProfile
        required: false
        default: default
    outputs:
      - name: projectConfig
      - name: configSummary
    preconditions:
      - workspaceRoot 可访问
    side_effects:
      - 可能暂停流程等待用户输入
    default_on_fail: block
    evidence_policy: interactive_config_log

  - id: config.merge_profiles
    kind: base
    description: >-
      合并基础 profile 和项目级配置。以 base_profile 为基础，用项目配置的 slots、semantics
      覆盖对应字段，生成最终的 directory profile。
    inputs:
      - name: baseProfile
        required: true
      - name: projectConfig
        required: false
    outputs:
      - name: mergedProfile
      - name: overriddenSlots
    preconditions:
      - baseProfile 已加载
    side_effects: []
    default_on_fail: block
    evidence_policy: merge_report

  - id: e2e.classify_scope
    kind: base
    description: >-
      根据任务包的 tasks.md 改动点分析涉及的 E2E 模块，将 e2e_scope 写入 run_result.json。
      读取 tests/e2e/modules.json 注册表，将改动文件路径映射到模块名。
      特殊规则：跨模块重构或基础设施变更时标记为 ["all"]。
    inputs:
      - name: taskPath
        required: true
        description: 任务包目录路径
      - name: changedFiles
        required: true
        description: 本次改动的文件路径列表
      - name: modulesRegistry
        required: false
        description: modules.json 路径，默认 tests/e2e/modules.json
    outputs:
      - name: e2eScope
        description: 模块名数组，如 ["upload", "export"]
      - name: e2eNote
        description: scope 选择理由
    preconditions:
      - 任务包开发已完成
      - changedFiles 已收集
    side_effects:
      - 修改 run_result.json 的 e2e_scope 和 e2e_note 字段
    default_on_fail: continue_with_warning

  - id: e2e.selective_run
    kind: base
    description: >-
      根据 e2e_scope 执行选择性 E2E 测试。
      调用 scripts/select-e2e.js 将 scope 展开为文件列表，传给 Playwright CLI。
      mandatory 模块（如 cleanup）自动注入。
    inputs:
      - name: e2eScope
        required: true
        description: 模块名数组
      - name: modulesRegistry
        required: false
        description: modules.json 路径
      - name: playwrightConfig
        required: false
        description: playwright 配置文件路径
    outputs:
      - name: e2eResult
        description: E2E 测试结果（pass/fail + 详情）
      - name: testFiles
        description: 实际运行的测试文件列表
    preconditions:
      - 生产模式服务已启动且 5280 端口就绪
      - dist/ 已编译
    side_effects: []
    default_on_fail: block

  - id: custom.described_action
    kind: base
    experimental: true
    description: >-
      通用“自定义基础动作”。当工作流暂时没有合适的标准基础动作时，允许通过
      with.description 描述需要做的事，由 AI 读取该 description 字段来判断执行方式。
      如果同类描述在多个 workflow 中重复出现，就应该把它升级为正式基础动作。
    inputs:
      - name: description
        required: true
      - name: expected_outputs
        required: false
      - name: success_criteria
        required: false
      - name: constraints
        required: false
      - name: layout
        required: false
    outputs:
      - name: result
      - name: evidence
    preconditions:
      - description 必须具体说明目标、范围、产物与完成标准
      - 若 description 涉及目录路径，优先使用 layout 中的语义槽位而不是写死物理目录
    side_effects:
      - 允许在 description 明确声明的边界内读写文件、更新状态或触发交互
    default_on_fail: block
    evidence_policy: explicit
    promotion_rule: >-
      当该动作模式被 2 个及以上 workflow 重复引用，或 description 已稳定到可以明确抽象，
      则应从 custom.described_action 晋升为正式基础动作。


# ============================================================
# questionSets — interaction.ask_questions_gate 引用的问题集
# ============================================================
questionSets:
  - id: fix_scope_selection
    description: fix 工作流：用户选择本次处理范围
    questions:
      - key: range
        prompt: 请选择本次处理范围
        type: single_choice
        options:
          - value: all
            label: 全部处理
            description: "处理 P1-P4 所有问题（共 {total} 条）"
          - value: p1_only
            label: 仅处理 P1
            description: "只处理 P1 紧急问题（{p1_count} 条）"
          - value: p1_p2
            label: P1 + P2
            description: "处理 P1 和 P2 问题（{p1_p2_count} 条）"
          - value: custom
            label: 自定义
            description: "手动选择要处理的级别"
      - key: reason
        prompt: 选择理由（可选）
        type: text
        optional: true

  - id: fix_strategy_selection
    description: fix 工作流：用户选择修复介入深度
    questions:
      - key: strategy
        prompt: 修复方案如何确定？
        type: single_choice
        options:
          - value: ai_decide
            label: 全部由 AI 决定
            description: "AI 分析后直接选择推荐方案执行，效率最高"
          - value: confirm_all
            label: 逐个问题确认
            description: "每个问题都展示方案供你确认，最审慎"
          - value: hybrid
            label: 重点确认 + AI 自动
            description: "你指定重点关注的问题，其余由 AI 选择推荐方案"
      - key: reason
        prompt: 选择理由（可选）
        type: text
        optional: true

  - id: fix_focus_selection
    description: "fix 工作流：hybrid 模式下选择需用户亲自确认的问题（其余自动采纳推荐方案）"
    questions:
      - key: focus_issues
        prompt: 选择需要你亲自确认的问题（其余自动采纳推荐方案）
        type: multi_choice
        options_from: "${ analysis_results.issueAnalysisResults }"
      - key: reason
        prompt: 选择理由（可选）
        type: text
        optional: true
