      - id: pinnedIndex
        labelKey: settings.pinnedIndex
        # tl1487 八组：置顶记忆索引化未稳定→可选（用户 20261107 八组清单；
        # 默认关=铁律 2 不变）。
        tier: optional
        onKeys: [experimentalPinnedIndex]
