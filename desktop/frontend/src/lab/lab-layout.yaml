# 任务 722/724 — 实验室布局第一版定义（lab-layout.yaml）。
#
# 这是 724 yaml 化机制的第一个真实数据：分组树 / 配置键引用 / 徽章档位 /
# 排序全部由本文件描述；内容与 src/lab/labLayoutDefault.ts（内置默认 =
# 安全网回退值）同构同值。
#
# 规则（724 硬约束）：
#   - labelKey 必须是字典里存在的 locale 键（禁止内联文案，三语不回归）；
#   - onKeys 只能引用 src/lab/labLightKeys.ts 注册表里的 id（配置键语义
#     零变化，判亮规则收拢在谓词里）；
#   - entry.id 必须在 SettingsPanel 的 pane 白名单里；member.id 必须在
#     档位注册表（lib/experimentTiers.ts）里且必填 tier；
#   - 任何一行不合规则 ⇒ 整份文件作废，回退内置默认布局（不白屏）；
#   - dev 模式改本文件保存即热加载生效（vite ?raw 监听）。
#
# 内容 = 现状全量设置分组 + 任务 722 六点调整 + 任务 727 登记 + 任务 742：
#   点1 备用模型行迁「模型策略」卡（行级，SettingsPanel）；
#   点2 modelStrategy 不再挂「已退役」徽章（成员表无 modelCapabilityFilter）；
#   点3 自动折叠跨会话消息并为 sessionCollab 卡子项；
#   点5 compactModel 并入 safetyCostControl 卡；
#   点6 messageMerge 并入 safetyCostControl，整卡自 automation 迁 efficiency；
#   727 heartbeatRotation 登记（桥接 heartbeat-rotation.json 的 enabled，
#       默认开，故不参与卡片灯 onKeys）；
#   742 tabCompress + tabModeTint 两个独立条目合并为「标签页管理」单卡。
#       条目级合并（561/722 先例）：两键各留各的 setter 与语义，卡内行级
#       仍挂各自徽章；配置键零变化，已存偏好升级后原样生效；
#   742 heartbeatBackground「心跳任务后台化」登记（automation 组独立卡，
#       默认关，可选项）。
#   775 参数迁移基建（设计《实验室布局可调设计》§4.1/4.2，γ 渐进登记）：
#       entry 新增 kind:param（无开关字段卡，fields 支持 number/text/segment/
#       checkbox），字段值读写绑定收拢在 src/lab/labParamFields.ts；首批两参
#       数迁「存储」组——后台会话闲置释放（308-O4）+ Go 软内存上限（308-O3），
#       自跨会话协作卡硬编码行迁出（数据驱动渲染，配置键/setter 零变化）。

version: 1
groups:
  # ── 自动化（5 项；任务 742 增心跳任务后台化）──────────────────
  - key: automation
    labelKey: settings.labGroup.automation
    entries:
      - id: autopilot
        labelKey: settings.autopilot
        tier: recommended
        onKeys: [autopilot]
      - id: sessionCollab
        labelKey: settings.sessionCollab
        tier: recommended
        # 任务 815：cascade_approval 是卡内行级开关（Task 225），补灯——
        # 审批回投开 = 卡亮（无 member 行，家族伴生不挂徽章）。
        onKeys: [experimentalSessionCollab, experimentalCascadeApproval]
        members:
          # 任务 722 点3：跨会话协作的展示子项。
          - id: sessionCollabAutoFold
            labelKey: settings.sessionCollabAutoFold
            tier: optional
      - id: fullAccess
        labelKey: settings.fullAccess
        tier: recommended
        onKeys: [experimentalFullAccess]
      - id: dream
        labelKey: settings.dream
        tier: optional
        onKeys: [experimentalDream]
      # 任务 801：决策模式自动提取+固化（提取链+固化链，默认关）。
      - id: decisionPatterns
        labelKey: settings.decisionPatterns
        tier: optional
        onKeys: [experimentalDecisionPatterns]
      # 任务 742：心跳任务后台化——开启后心跳触发不进标签栏（264 detached
      # 语义，提交成功后 park）。默认关=现状一致。
      - id: heartbeatBackground
        labelKey: settings.heartbeatBackground
        tier: optional
        onKeys: [experimentalHeartbeatBackground]

  # ── 提效（8 项；任务 722：安全/成本控制卡迁入本组）────────────
  - key: efficiency
    labelKey: settings.labGroup.efficiency
    entries:
      - id: optimisticParallel
        labelKey: settings.optimisticParallel
        tier: recommended
        # 任务 815：bash_heavy_guard（575）补实验室入口——optimistic-parallel
        # 卡成员行（写并发保护，optimistic_write 家族伴生开关；pane 行+灯，
        # 无 member 行不挂独立徽章）。
        onKeys: [optimisticWrite, experimentalBashHeavyGuard]
      - id: contextGovernance
        labelKey: settings.contextGovernance
        # 任务 722 点5：compactModel 迁出（键引用同步移走）。
        # 任务 815：active_tab_resident 补灯（Task 347 附属行早已在 pane，
        # Go 侧 cacheTuning renderKeys 家族已含——前端灯漏接，开了卡不亮）。
        onKeys: [experimentalCompactionParallel, experimentalContextBudget, experimentalResearchBudget, experimentalProactiveCompact, experimentalColdCacheCompact, experimentalCacheTuning, experimentalActiveTabResident]
        members:
          - id: compactionParallel
            labelKey: settings.compactionParallel
            tier: optional
          - id: budgetControl
            labelKey: settings.contextBudget
            tier: recommended
          - id: compressOpt
            labelKey: settings.proactiveCompact
            tier: recommended
          - id: cacheTuning
            labelKey: settings.cacheTuning
            tier: optional
      - id: safetyCostControl
        labelKey: settings.safetyCostControl
        tier: optional
        # 灯=家族任一非默认；heartbeatRotation 默认开，不参与（见文件头）。
        onKeys: [experimentalSafetyCostControl, experimentalCompactModel, collabInboxMergeOn, collabGuidanceMerge]
        members:
          # 任务 722 点5：指定压缩模型（707）。
          - id: compactModel
            labelKey: settings.compactModel
            tier: optional
          # 任务 722 点6：消息合并。
          - id: messageMerge
            labelKey: settings.messageMerge
            tier: recommended
          # 任务 727：心跳会话轮换。
          - id: heartbeatRotation
            labelKey: settings.heartbeatRotation
            tier: optional
      - id: modelStrategy
        labelKey: settings.modelStrategy
        # 任务 722 点2：成员表无 modelCapabilityFilter——「已退役」徽章移除。
        # 任务 815：fallback_model 补灯（722 点1 迁入的行级开关，开了卡不亮）。
        onKeys: [experimentalHighSpeedModel, experimentalFallbackModel]
        members:
          - id: highSpeedModel
            labelKey: settings.highSpeedModel
            tier: optional
      - id: quickCommands
        labelKey: settings.quickCommands
        tier: recommended
        onKeys: [experimentalQuickCommands]
      - id: traceAsState
        labelKey: settings.traceAsState
        tier: optional
        onKeys: [experimentalTraceAsState]
      - id: outputStyle
        labelKey: settings.outputStyle
        tier: optional
        onKeys: [experimentalOutputStyleUI, outputStyleActive]
      - id: collabHub
        labelKey: settings.collabHub
        tier: unstable
        onKeys: [experimentalCollabHub]

  # ── 界面（9 项；任务 742：tab 二开关合并为「标签页管理」；任务 782：
  #    三张条目级合并卡 + opencodeGoUsage 迁出至可观测性组）────────────
  - key: ui
    labelKey: settings.labGroup.ui
    entries:
      # 任务 742：标签页管理（合并卡）。灯 = 自适应压缩开 或 权限指示离默认档；
      # 卡徽章可选。卡内两行各自读自己的键、写自己的 setter：
      #   行1 标签栏自适应压缩（experimental_tab_compress，506）；
      #   行2 标签权限指示（tab_permission_indicator 三档，651）。
      # 已存偏好零迁移：两键原样保留，升级后行为不突变。
      - id: tabManagement
        labelKey: settings.tabManagement
        tier: optional
        onKeys: [experimentalTabCompress, tabModeTintNonDefault]
      # 任务 782：视图布局（合并卡，742 先例）——分栏 + 轨迹视图。容器档 =
      # 成员最高档（可选）；卡内两行各读各键各写各 setter，配置键零变化。
      # 任务 826：左右边栏 hover 展开两行入卡（左右独立两键两行，默认关；
      # 300ms 防误触 + 离开 15s 延时折叠，只回收 hover 自动展开的）。
      - id: viewLayout
        labelKey: settings.viewLayout
        tier: optional
        onKeys: [experimentalSplitView, experimentalTrajectoryView, experimentalSidebarHoverLeft, experimentalSidebarHoverRight]
        members:
          - id: splitView
            labelKey: settings.splitView
            tier: optional
          - id: trajectoryView
            labelKey: settings.trajectoryView
            tier: optional
          - id: sidebarHoverLeft
            labelKey: settings.sidebarHoverLeft
            tier: optional
          - id: sidebarHoverRight
            labelKey: settings.sidebarHoverRight
            tier: optional
      - id: todoSidebar
        labelKey: settings.todoSidebar
        tier: recommended
        onKeys: [experimentalTodoSidebar]
      # 任务 782：检索与历史（合并卡）——历史提问选择器 + 搜索历史提问 +
      # 自动加载更早消息。容器档 = 成员最高档（推荐）。
      - id: searchHistory
        labelKey: settings.searchHistory
        tier: recommended
        onKeys: [experimentalPromptHistoryPicker, experimentalQuestionSearch, experimentalAutoLoadOlder]
        members:
          - id: promptHistoryPicker
            labelKey: settings.promptHistoryPicker
            tier: recommended
          - id: questionSearch
            labelKey: settings.questionSearch
            tier: recommended
          - id: autoLoadOlder
            labelKey: settings.autoLoadOlder
            tier: optional
      - id: sessionWall
        labelKey: settings.sessionWall
        tier: recommended
        onKeys: [experimentalSessionWall]
      # 任务 686：工作流可视化面板（685 引擎未落地，前端 fixture 预览）。
      - id: workflowPanel
        labelKey: settings.workflowPanel
        tier: unstable
        onKeys: [experimentalWorkflowPanel]
      - id: subagentSuite
        labelKey: settings.subagentSuite
        onKeys: [experimentalSubagentPanel, experimentalSubagentDetail, experimentalSubagentPolicy, experimentalSubagentTps]
        members:
          - id: subagentPanel
            labelKey: settings.subagentPanel
            tier: optional
          - id: subagentDetail
            labelKey: settings.subagentDetail
            tier: optional
          - id: subagentPolicy
            labelKey: settings.subagentPolicy
            tier: unstable
          - id: subagentTps
            labelKey: settings.subagentTps
            tier: optional
      # 任务 782 验收⑤：任务完成摘要保持独立（Go 用量迁出后无合并对象）。
      - id: completionSummary
        labelKey: settings.completionSummary
        tier: optional
        onKeys: [experimentalCompletionSummary]
      # 任务 782：输入与选区（合并卡）——草稿持久化 + 选区快捷操作。容器
      # 档 = 成员最高档（可选）。
      - id: inputSelection
        labelKey: settings.inputSelection
        tier: optional
        onKeys: [experimentalComposerDraft, experimentalSelectionActions]
        members:
          - id: draftPersistence
            labelKey: settings.draftPersistence
            tier: optional
          - id: selectionActions
            labelKey: settings.selectionActions
            tier: optional
      # 任务 782④：opencodeGoUsage 迁出界面组（→任务 783 可观测性组
      # 「用量监测」卡成员；迁出瞬间 pane 分支保留，入口随 783 落卡恢复）。
      - id: updateFeedback
        labelKey: settings.updateFeedback
        onKeys: [experimentalRestartUpdate, experimentalFeedback, forkNotice]
        members:
          - id: restartUpdate
            labelKey: settings.restartUpdate
            tier: recommended
          - id: feedback
            labelKey: settings.feedback
            tier: optional

  # ── 可观测性（2 项；任务 783：用量监测卡落组）─────────────────
  - key: observability
    labelKey: settings.labGroup.observability
    entries:
      - id: monitoring
        labelKey: settings.monitoring
        tier: recommended
        onKeys: [experimentalSessionMonitor, experimentalPerfMonitor]
      # 任务 783：「用量监测」合并卡（coding plan 用量架构）——GLM Plan 用量
      # （PlanUsageCard 已上线，provider 解析显示，无开关展示行）+ OpenCode Go
      # 用量（自界面组迁入，782④ 同一动作的落卡半程）。
      # 扩展点：coding plan preset 家族（GLM CN / Z.AI Global / Qwen CN·Global /
      # Kimi 等 7+ 家）未来按需在 members 加行即成一子项，不改容器结构；
      # 卡灯 = OpenCode Go 开关（家族唯一非默认键）。
      - id: usageMonitoring
        labelKey: settings.usageMonitoring
        tier: recommended
        onKeys: [experimentalOpenCodeGoUsage]
        members:
          - id: glmPlanUsage
            labelKey: settings.glmPlanUsage
            tier: recommended
          - id: opencodeGoUsage
            labelKey: settings.opencodeGoUsage
            tier: unstable

  # ── 开发调试（1 项）─────────────────────────────────────────
  - key: dev-debug
    labelKey: settings.labGroup.devDebug
    entries:
      - id: devDebug
        labelKey: settings.devDebug
        onKeys: [experimentalCDPDebugPort, experimentalLifecycleNoiseGate]
        members:
          - id: cdpDebugPort
            labelKey: settings.cdpDebugPort
            tier: unstable
          - id: lifecycleNoiseGate
            labelKey: settings.lifecycleNoiseGate
            tier: unstable

  # ── 存储（3 项；任务 775：闲置释放/内存上限两参数卡迁入）────────────
  - key: storage
    labelKey: settings.labGroup.storage
    entries:
      - id: sessionStore
        labelKey: settings.sessionStore
        onKeys: [sessionStorageNonDefault, eventsRotationNonDefault]
        members:
          - id: sessionStorage
            labelKey: settings.sessionStorage
            tier: unstable
          - id: eventsRotation
            labelKey: settings.eventsRotation
            tier: optional
      # 任务 846：配置数据目录可更改（未稳定档，默认关）。独立卡+独立 pane
      # （向导在 SettingsPanel 的 homePointer 分支，HomePointerLabPane）。
      - id: homePointer
        labelKey: settings.homePointer
        tier: unstable
        onKeys: [homePointer]
      # 任务 775：后台会话闲置释放（308-O4）——首批 kind:param 参数卡。
      # 无开关纯字段卡（分钟；0=从不释放）；字段绑定在 src/lab/labParamFields.ts
      # （值语义收拢在代码，yaml 只描述结构与引用——724 硬约束同构延伸）。
      # 任务 781：补 tier（闲置释放=recommended）。
      - id: idleReleaseMinutes
        labelKey: settings.detachedIdleRelease
        kind: param
        tier: recommended
        fields:
          - id: detachedIdleReleaseMinutes
            input: number
      # 任务 775：Go 软内存上限（308-O3，debug.SetMemoryLimit，MB；0=不设限）
      # ——参数卡（无开关）。任务 781：补 tier（软内存上限=optional）。
      - id: goMemLimit
        labelKey: settings.goMemLimit
        kind: param
        tier: optional
        fields:
          - id: goMemLimitMB
            input: number

  # ── 基础设施（5 项；任务 785：baseProcess 条目随 S1 底座开关退役移除）──
  - key: infra
    labelKey: settings.labGroup.infra
    entries:
      - id: runtimeReuse
        labelKey: settings.runtimeReuse
        tier: optional
        onKeys: [experimentalRuntimeReuse]
      - id: zcodeTaskBus
        labelKey: settings.zcodeTaskBus
        tier: unstable
        onKeys: [experimentalZcodeTaskBus]
      # 任务 790：ACP 常驻监听（loopback TCP，每连接独立 client 面；默认关，
      # 重启生效）。815：tier optional→unstable——修正与内置 default/前端注册
      # 表/Go labFeatureTiers 三方的既有漂移（722 同构锚要求 yaml=default）。
      - id: acpListen
        labelKey: settings.acpListen
        tier: unstable
        onKeys: [experimentalACPListen]
      - id: pathRules
        labelKey: settings.pathRules
        tier: unstable
        onKeys: [experimentalPathRules]
      - id: orphanHandling
        labelKey: settings.orphanHandling
        tier: unstable
        onKeys: [experimentalOrphanHandling]
      - id: localServer
        labelKey: settings.localServer
        tier: unstable
        onKeys: [experimentalLocalServer]

  # ── 工具优化（1 项）────────────────────────────────────────
  - key: tool-opt
    labelKey: settings.labGroup.toolOpt
    entries:
      # 任务 783④：编辑读回（readBack）随 22.5 交付转正——未稳定→推荐。
      - id: toolOptimizations
        labelKey: settings.toolOptimizations
        tier: recommended
        onKeys: [experimentalToolOptimizations]
        members:
          # 任务 789：编辑证据门宽松模式（同轮读取计数+悬置证据不连带拦 bash）。
          - id: editEvidenceRelaxed
            labelKey: settings.editEvidenceRelaxed
            tier: unstable
