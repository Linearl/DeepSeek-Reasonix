# 任务 722/724 — 实验室布局第一版定义（lab-layout.yaml）。
#
# 这是 724 yaml 化机制的第一个真实数据：分组树 / 配置键引用 / 徽章档位 /
# 排序全部由本文件描述；内容与 src/lab/labLayoutDefault.ts（内置默认 =
# 安全网回退值）同构同值。
#
# 规则（724 硬约束）：
#   - labelKey 必须是字典里存在的 locale 键（禁止内联文案，三语不回归）；
#   - onKeys 只能引用 src/lab/labLightKeys.ts 注册表里的 id（配置键语义
#     零变化，判亮规则收拢在谓词里）；
#   - entry.id 必须在 SettingsPanel 的 pane 白名单里；member.id 必须在
#     档位注册表（lib/experimentTiers.ts）里且必填 tier；
#   - 任何一行不合规则 ⇒ 整份文件作废，回退内置默认布局（不白屏）；
#   - dev 模式改本文件保存即热加载生效（vite ?raw 监听）。
#
# 内容 = 现状全量设置分组 + 任务 722 六点调整 + 任务 727 登记 + 任务 742：
#   点1 备用模型行迁「模型策略」卡（行级，SettingsPanel）；
#   点2 modelStrategy 不再挂「已退役」徽章（成员表无 modelCapabilityFilter）；
#   点3 自动折叠跨会话消息并为 sessionCollab 卡子项；
#   点5 compactModel 并入 safetyCostControl 卡；
#   点6 messageMerge 并入 safetyCostControl，整卡自 automation 迁 efficiency；
#   727 heartbeatRotation 登记（桥接 heartbeat-rotation.json 的 enabled，
#       默认开，故不参与卡片灯 onKeys）；
#   742 tabCompress + tabModeTint 两个独立条目合并为「标签页管理」单卡。
#       条目级合并（561/722 先例）：两键各留各的 setter 与语义，卡内行级
#       仍挂各自徽章；配置键零变化，已存偏好升级后原样生效；
#   742 heartbeatBackground「心跳任务后台化」登记（automation 组独立卡，
#       默认关，可选项）。
#   775 参数迁移基建（设计《实验室布局可调设计》§4.1/4.2，γ 渐进登记）：
#       entry 新增 kind:param（无开关字段卡，fields 支持 number/text/segment/
#       checkbox），字段值读写绑定收拢在 src/lab/labParamFields.ts；首批两参
#       数迁「存储」组——后台会话闲置释放（308-O4）+ Go 软内存上限（308-O3），
#       自跨会话协作卡硬编码行迁出（数据驱动渲染，配置键/setter 零变化）。
#   961 条目级收编三处（742/782 合并卡先例，配置键零变化，已存偏好零迁移）：
#       automation 组 dream+decisionPatterns+heartbeatBackground 三散条并
#       「智能自动化」卡（smartAutomation）；efficiency 组 quickCommands+
#       traceAsState+outputStyle 三散条并「交互与呈现」卡
#       （interactionPresentation）；ui 组 renderArtifact 并入「视图布局」
#       （viewLayout）卡成员行。
#   tl1193b 新增「记忆与上下文」组：pinnedIndex 卡（plan E pinned 常驻层
#       索引化，未稳定档，默认关，boot 快照重启生效）。tl1256 调序：本组
#       移基础设施组之后（原 automation 后 efficiency 前，用户 20261029 令）。
#   tl1487 八组批量档位调整（用户 20261107 逐条裁决清单）：collabHub→稳定、
#       回答风格→推荐、模型能力过滤只读行移除（不展示）、冷缓存压缩+下限+
#       闲置时长三行并一卡（可选徽章）、界面/子代理/存储/基础设施/记忆多批
#       升推荐、工作流面板与 CDP 调试端口→稳定、OpenCode Go 用量撤开关常开、
#       tl134 路径规则整卡移除（过时技术，存档已入 docs/archive）——逐条
#       注释见各条目。

version: 1
groups:
  # ── 自动化（4 项；任务 742 增心跳任务后台化；任务 961 三散条并智能自动化卡）──
  - key: automation
    labelKey: settings.labGroup.automation
    entries:
      # 任务 1005 批1 转档：autopilot / sessionCollab / fullAccess（及 infra 段
      # runtimeReuse）四项 tier 升「稳定」——与内置默认同构（724 回退安全网）。
      # 任务 1084：autopilot pane 硬编码渲染区加 5 个高风险授权 checkbox
      # （默认全不勾）+ 1 个 ask 轮次上限数值字段——kind 仍为 feature。
      - id: autopilot
        labelKey: settings.autopilot
        tier: stable
        onKeys: [autopilot]
      - id: sessionCollab
        labelKey: settings.sessionCollab
        tier: stable
        # 任务 815：cascade_approval 是卡内行级开关（Task 225），补灯——
        # 审批回投开 = 卡亮（无 member 行，家族伴生不挂徽章）。
        onKeys: [experimentalSessionCollab, experimentalCascadeApproval]
        members:
          # 任务 722 点3：跨会话协作的展示子项。
          - id: sessionCollabAutoFold
            labelKey: settings.sessionCollabAutoFold
            tier: optional
      - id: fullAccess
        labelKey: settings.fullAccess
        tier: stable
        onKeys: [experimentalFullAccess]
      # 任务 961：智能自动化（合并卡，742/782 条目级合并先例）——梦境整理 +
      # 决策模式提取 + 心跳任务后台化三散条并卡。容器档 = 成员最高档（全可选
      # → 可选）；卡内三行各读各的键、各写各的 setter，配置键零变化。任务
      # 1069：stalledIntentNudge（模型提前结束判定器续轮提醒）作为第四成员行
      # 入卡。
      - id: smartAutomation
        labelKey: settings.smartAutomation
        tier: optional
        # tl1453：experimentalDream 随 dream/distill 实验退役，onKeys/成员摘除。
        onKeys: [experimentalDecisionPatterns, experimentalHeartbeatBackground, stalledIntentNudge, standardContinuation]
        members:
          # 任务 801：决策模式自动提取+固化（提取链+固化链，默认关）。
          - id: decisionPatterns
            labelKey: settings.decisionPatterns
            tier: optional
          # 任务 742：心跳任务后台化——开启后心跳触发不进标签栏（264 detached
          # 语义，提交成功后 park）。默认关=现状一致。
          # tl1265 第2轮（2026-11-13 拍板 dec-73872eee136e22de）：可选→推荐。
          - id: heartbeatBackground
            labelKey: settings.heartbeatBackground
            tier: recommended
          # 任务 1069：模型提前结束判定器续轮提醒（stalled_intent_nudge，117
          # 首落地，本件补设置页入口）。默认关=现状一致。
          - id: stalledIntentNudge
            labelKey: settings.stalledIntentNudge
            tier: optional
          # 任务 1070：Standard 流续跑总闸——普通对话续跑通道开闸。默认关=
          # 现状一致；开启后仍有界上限与各边界排除。
          - id: standardContinuation
            labelKey: settings.standardContinuation
            tier: optional

  # ── 提效（5 项；任务 722：安全/成本控制卡迁入本组；任务 961 三散条并
  #    交互与呈现卡；tl1309：optimisticParallel 散条并入上下文治理卡成员行）──
  - key: efficiency
    labelKey: settings.labGroup.efficiency
    entries:
      - id: contextGovernance
        labelKey: settings.contextGovernance
        # 任务 722 点5：compactModel 迁出（键引用同步移走）。
        # 任务 815：active_tab_resident 补灯（Task 347 附属行早已在 pane，
        # Go 侧 cacheTuning renderKeys 家族已含——前端灯漏接，开了卡不亮）。
        # tl1309：optimisticParallel 散条并入本卡（任务书①：提效组剩余散条
        # 并入既有 contextGovernance 卡）——乐观并行的两键（optimistic_write
        # 主键 + bash_heavy_guard 575 家族伴生）随迁入灯；卡内 pane 行迁至
        # 本卡尾部（乐观并行主行 + 重 bash 守护 + 推理-only 续跑修复三行，
        # 各读各键各写各 setter，配置键零变化）。容器档 = 成员最高档（乐观
        # 并行/预算/主动压缩推荐 → 推荐，聚合徽章与并入前一致）。
        onKeys: [experimentalCompactionParallel, experimentalContextBudget, experimentalResearchBudget, experimentalProactiveCompact, experimentalColdCacheCompact, experimentalCurateContext, experimentalReviewHint, experimentalCacheTuning, experimentalActiveTabResident, optimisticWrite, experimentalBashHeavyGuard]
        members:
          - id: compactionParallel
            labelKey: settings.compactionParallel
            tier: optional
          - id: budgetControl
            labelKey: settings.contextBudget
            tier: recommended
          - id: compressOpt
            labelKey: settings.proactiveCompact
            tier: recommended
          - id: cacheTuning
            labelKey: settings.cacheTuning
            tier: optional
          # tl1309：乐观并行（原 efficiency 独立卡，推荐档，并入本卡尾部；
          # pane 内 bash_heavy_guard/reasoning_only_continuation 两行为其家族
          # 伴生行，不挂独立徽章——621 附属行口径）。
          - id: optimisticParallel
            labelKey: settings.optimisticParallel
            tier: recommended
      - id: safetyCostControl
        labelKey: settings.safetyCostControl
        tier: optional
        # 灯=家族任一非默认；heartbeatRotation 默认开，不参与（见文件头）。
        onKeys: [experimentalSafetyCostControl, experimentalCompactModel, collabInboxMergeOn, collabGuidanceMerge]
        members:
          # 任务 722 点5：指定压缩模型（707）。
          - id: compactModel
            labelKey: settings.compactModel
            tier: optional
          # 任务 722 点6：消息合并。
          - id: messageMerge
            labelKey: settings.messageMerge
            tier: recommended
          # 任务 727：心跳会话轮换。
          - id: heartbeatRotation
            labelKey: settings.heartbeatRotation
            tier: optional
      - id: modelStrategy
        labelKey: settings.modelStrategy
        # 任务 722 点2：成员表无 modelCapabilityFilter——「已退役」徽章移除。
        # 任务 815：fallback_model 补灯（722 点1 迁入的行级开关，开了卡不亮）。
        onKeys: [experimentalHighSpeedModel, experimentalFallbackModel]
        members:
          - id: highSpeedModel
            labelKey: settings.highSpeedModel
            tier: optional
      # 任务 961：交互与呈现（合并卡，742/782 条目级合并先例）——快捷指令 +
      # 轨迹状态 + 回答风格三散条并卡。容器档 = 成员最高档（快捷指令推荐 →
      # 推荐）；卡内三行各读各的键、各写各的 setter，配置键零变化。
      - id: interactionPresentation
        labelKey: settings.interactionPresentation
        tier: recommended
        onKeys: [experimentalQuickCommands, experimentalTraceAsState, experimentalOutputStyleUI, outputStyleActive]
        members:
          # 快捷指令（原 efficiency 独立卡，推荐档，961 并卡）。
          - id: quickCommands
            labelKey: settings.quickCommands
            tier: recommended
          # 轨迹状态（原 efficiency 独立卡，961 并卡）。
          - id: traceAsState
            labelKey: settings.traceAsState
            tier: optional
          # 回答风格（原 efficiency 独立卡；灯=门控开或已选非默认风格，961 并卡）。
          # tl1487 一组②：回答风格行可选→推荐（用户 20261107 八组清单「交互
          # 与呈现/回答风格→推荐」；容器档仍=成员最高档推荐）。
          - id: outputStyle
            labelKey: settings.outputStyle
            tier: recommended
      - id: collabHub
        labelKey: settings.collabHub
        # tl1487 一组①：协作中心入口 unstable→稳定（用户 20261107 八组清单；
        # 前置依赖 sessionCollab 语义不变，LAB_FEATURE_DEPS 仍单条）。
        tier: stable
        onKeys: [experimentalCollabHub]

  # ── 界面（11 项；任务 742：tab 二开关合并为「标签页管理」；任务 782：
  #    三张条目级合并卡 + opencodeGoUsage 迁出至可观测性组；任务 961：
  #    renderArtifact 并入视图布局卡；tl 1132：新增「启动与加载」合并卡）──
  - key: ui
    labelKey: settings.labGroup.ui
    entries:
      # tl 1132：启动与加载（合并卡，742/782 条目级合并先例）——首项=启动
      # 遮罩；为 tl 1133 后续启动优化开关预留成员位。容器档 = 成员最高档
      # （可选）；卡内一行读自己的键、写自己的 setter。默认关（用户
      # 2026-10-24 steer：做成实验特性允许开关方便 A/B 对比；铁律 2——关时
      # splash 不渲染、启动行为与引入前逐字节一致）。
      - id: startupLoading
        labelKey: settings.startupLoading
        tier: optional
        onKeys: [experimentalStartupSplash]
        members:
          - id: startupSplash
            labelKey: settings.startupSplash
            tier: optional
      # 任务 742：标签页管理（合并卡）。灯 = 自适应压缩开 或 权限指示离默认档；
      # 卡徽章可选。卡内两行各自读自己的键、写自己的 setter：
      #   行1 标签栏自适应压缩（experimental_tab_compress，506）；
      #   行2 标签权限指示（tab_permission_indicator 三档，651）。
      # 已存偏好零迁移：两键原样保留，升级后行为不突变。
      # tl 1125：标签页管理合并卡升「推荐」（用户 2026-10-24 指令，与视图布局
      # 一并；配置键/默认值/卡内成员档位零变化，只动容器徽章档）。
      # tl1309 卡④：todoSidebar（侧栏增强）散条并入本卡成员行——侧栏标签显隐
      # 墙与标签栏压缩/权限指示同属标签页管理面（任务书④按「视图布局/标签页
      # 管理」先例归卡）；灯键随迁。容器档 仍推荐。
      - id: tabManagement
        labelKey: settings.tabManagement
        tier: recommended
        onKeys: [experimentalTabCompress, tabModeTintNonDefault, experimentalTodoSidebar]
        members:
          - id: todoSidebar
            labelKey: settings.todoSidebar
            tier: recommended
      # 任务 782：视图布局（合并卡，742 先例）——分栏 + 轨迹视图。容器档 =
      # 成员最高档（可选）；卡内两行各读各键各写各 setter，配置键零变化。
      # 任务 826：左右边栏 hover 展开两行入卡（左右独立两键两行，默认关；
      # 300ms 防误触 + 离开 15s 延时折叠，只回收 hover 自动展开的）。
      # 任务 940：composer 权限选择器形态二选一行入卡（默认关=现按钮组，
      # 开=zcode 同款下拉框省空间）。
      # 任务 959 ①：对话表格按栏宽自动换行入卡为成员行（940 先例，默认关=
      # 宽表横滚布局不变）。
      # tl 1125：视图布局合并卡升「推荐」（与标签页管理一并，同指令）。
      - id: viewLayout
        labelKey: settings.viewLayout
        tier: recommended
        # tl1309 卡②：trajectoryView（轨迹观测）迁出本卡成员表，入可观测性组
        # 「运行可观测」卡（704 定位即「可观测性视图」）；灯键随迁出。容器档
        # 仍推荐（自有档推荐压过其余可选成员，聚合徽章不变）。
        onKeys: [experimentalSplitView, experimentalSidebarHoverLeft, experimentalSidebarHoverRight, experimentalApprovalSelect, experimentalTableWrap, experimentalSendTargetSelect, experimentalSmoothScrollFollow, experimentalDraftRewrite]
        members:
          - id: splitView
            labelKey: settings.splitView
            # tl1265 第2轮（2026-11-13 拍板 dec-73872eee136e22de）：可选→推荐。
            tier: recommended
          # tl1487 二组②：以下四行可选→推荐（用户 20261107 八组清单「侧栏
          # 标签显示、表格按栏宽换行、对话权限下拉框、右边栏悬停展开、左边栏
          # 悬停展开→推荐」；todoSidebar 已是推荐，无动作）。
          - id: sidebarHoverLeft
            labelKey: settings.sidebarHoverLeft
            tier: recommended
          - id: sidebarHoverRight
            labelKey: settings.sidebarHoverRight
            tier: recommended
          - id: approvalSelect
            labelKey: settings.approvalSelect
            tier: recommended
          # 任务 959 ①：对话表格按栏宽自动换行（默认关=宽表横滚不变）。
          - id: tableWrap
            labelKey: settings.tableWrap
            tier: recommended
          # 任务 959 ②：发送目标选择器形态二选一（默认关=三按钮组）。
          # tl1487 二组③：开启态下拉框位置改分栏下方（渲染面 Composer）。
          - id: sendTargetSelect
            labelKey: settings.sendTargetSelect
            tier: optional
          # tl 1165：流式滚动平滑跟随（DSH ScrollFollow 同款四条防线；默认
          # 关=瞬移定位逐字节不变）。tl1487 二组④：可选→推荐。
          - id: smoothScrollFollow
            labelKey: settings.smoothScrollFollow
            tier: recommended
          # 任务 1024：composer 草稿优化（改写按钮）——发送左侧新增改写入口，
          # 辅助模型改写草稿回填输入框，不自动发送。默认关=按钮不出现、布局零变化。
          # tl1487 二组④：可选→推荐。
          - id: draftRewrite
            labelKey: settings.draftRewrite
            tier: recommended
      # tl1309 卡④：会话与任务面板（合并卡，742/782/961 条目级合并先例）——
      # 会话图墙（palette 会话网格墙）+ 工作流面板（palette DAG 面板）+ 任务
      # 完成摘要（每轮结果卡）三散条并卡：三者同为「运行状态/产出的可视化
      # 面板面」（任务书④按先例归卡）。容器档 = 成员最高档（图墙推荐 →
      # 推荐）；卡内三行各读各的键、各写各的 setter，配置键零变化。
      - id: sessionTaskPanels
        labelKey: settings.sessionTaskPanels
        tier: recommended
        onKeys: [experimentalSessionWall, experimentalWorkflowPanel, experimentalWorkflowTemplates, experimentalCompletionSummary]
        members:
          - id: sessionWall
            labelKey: settings.sessionWall
            tier: recommended
          # tl1487 二组⑤：工作流面板 unstable→稳定、任务完成摘要可选→推荐
          # （用户 20261107 八组清单；工作流模板为 pane 附属行，同清单升推荐
          # ——前端注册表独立登记，Go 渲染表仍以 workflowPanel 家族子键承载）。
          # 容器档=成员最高档：随 workflowPanel 升至稳定。
          - id: workflowPanel
            labelKey: settings.workflowPanel
            tier: stable
          - id: completionSummary
            labelKey: settings.completionSummary
            tier: recommended
      # 任务 782：检索与历史（合并卡）——历史提问选择器 + 搜索历史提问 +
      # 自动加载更早消息。容器档 = 成员最高档（推荐）。
      - id: searchHistory
        labelKey: settings.searchHistory
        tier: recommended
        onKeys: [experimentalPromptHistoryPicker, experimentalQuestionSearch, experimentalAutoLoadOlder]
        members:
          - id: promptHistoryPicker
            labelKey: settings.promptHistoryPicker
            tier: recommended
          - id: questionSearch
            labelKey: settings.questionSearch
            tier: recommended
          # tl1487 二组⑥：自动加载可选→推荐（用户 20261107 八组清单
          # 「检索与历史/自动加载→推荐」）。
          - id: autoLoadOlder
            labelKey: settings.autoLoadOlder
            tier: recommended
      # tl1309 卡④：sessionWall/workflowPanel/completionSummary 三散条迁出——
      # 并入上方「会话与任务面板」合并卡（sessionTaskPanels）。
      - id: subagentSuite
        labelKey: settings.subagentSuite
        onKeys: [experimentalSubagentPanel, experimentalSubagentDetail, experimentalSubagentPolicy, experimentalSubagentTps]
        members:
          # tl1487 三组①：任务面板、子代理详情视图可选→推荐（用户 20261107
          # 八组清单）。
          - id: subagentPanel
            labelKey: settings.subagentPanel
            tier: recommended
          - id: subagentDetail
            labelKey: settings.subagentDetail
            tier: recommended
          # tl1265 第2轮（2026-11-13 拍板 dec-73872eee136e22de）：未稳定→可选。
          - id: subagentPolicy
            labelKey: settings.subagentPolicy
            tier: optional
          - id: subagentTps
            labelKey: settings.subagentTps
            tier: optional
      # tl1309 卡④：completionSummary 散条迁出——并入「会话与任务面板」卡。
      # 任务 782：输入与选区（合并卡）——草稿持久化 + 选区快捷操作。容器
      # 档 = 成员最高档（可选）。
      - id: inputSelection
        labelKey: settings.inputSelection
        # tl1487 三组②：草稿持久化、选区快捷操作可选→推荐（用户 20261107
        # 八组清单）；容器档=成员最高档，随成员升至推荐。
        tier: recommended
        onKeys: [experimentalComposerDraft, experimentalSelectionActions]
        members:
          - id: draftPersistence
            labelKey: settings.draftPersistence
            tier: recommended
          - id: selectionActions
            labelKey: settings.selectionActions
            tier: recommended
      # 任务 782④：opencodeGoUsage 迁出界面组（→任务 783 可观测性组
      # 「用量监测」卡成员；迁出瞬间 pane 分支保留，入口随 783 落卡恢复）。
      # 任务 992（用户 1018 21:34）：restartUpdate 归位回本卡——本文件随
      # 1005 一并补同步（992 漏同步 drift 收口：成员+灯键与内置默认对齐）。
      - id: updateFeedback
        labelKey: settings.updateFeedback
        onKeys: [experimentalFeedback, forkNotice, experimentalRestartUpdate]
        members:
          # tl1265 第2轮（2026-11-13 拍板 dec-73872eee136e22de）：可选→推荐。
          - id: feedback
            labelKey: settings.feedback
            tier: recommended
          - id: restartUpdate
            labelKey: settings.restartUpdate
            tier: recommended

  # ── 可观测性（3 项；任务 783：用量监测卡落组；tl1309 卡②：监控 + events
  #    瘦身 + 轨迹观测三面并「运行可观测」卡）─────────────────
  - key: observability
    labelKey: settings.labGroup.observability
    entries:
      # tl1309 卡②：运行可观测（合并卡，742/782/961 条目级合并先例）——
      # 监控（monitoring：会话+性能监控，perf monitor 面）+ events 瘦身
      # （eventsRotation：事件日志轮转面，自存储组 sessionStore 卡迁入）+
      # 轨迹观测（trajectoryView：轨迹投影面，自界面组 viewLayout 卡迁入）
      # 三成员并卡（任务书②：同属 events/perf 数据面）。容器档 = 成员最高档
      # （监控推荐 → 推荐）；卡内各行各读各的键、各写各的 setter，配置键零
      # 变化，已存偏好零迁移。
      - id: runtimeObservability
        labelKey: settings.runtimeObservability
        tier: recommended
        onKeys: [experimentalSessionMonitor, experimentalPerfMonitor, eventsRotationNonDefault, experimentalTrajectoryView]
        members:
          # 监控（原 observability 独立卡，推荐档，本件并卡；318.5 的
          # 会话+性能双开关保持卡内两行独立）。
          - id: monitoring
            labelKey: settings.monitoring
            tier: recommended
          # events 瘦身（原存储组 sessionStore 卡成员，迁入本卡）。
          - id: eventsRotation
            labelKey: settings.eventsRotation
            tier: optional
          # 轨迹观测（原界面组 viewLayout 卡成员，迁入本卡；704 DSH 同款
          # 可观测性视图，纯前端投影）。
          - id: trajectoryView
            labelKey: settings.trajectoryView
            tier: optional
      # 任务 783：「用量监测」合并卡（coding plan 用量架构）——GLM Plan 用量
      # （PlanUsageCard 已上线，provider 解析显示，无开关展示行）+ OpenCode Go
      # 用量（自界面组迁入，782④ 同一动作的落卡半程）。
      # 扩展点：coding plan preset 家族（GLM CN / Z.AI Global / Qwen CN·Global /
      # Kimi 等 7+ 家）未来按需在 members 加行即成一子项，不改容器结构。
      # tl1487 四组：OpenCode Go 用量「不提供开关、始终打开」——卡灯键清空
      # （用量查询常开，行同 glmPlanUsage 为无开关展示行）。
      - id: usageMonitoring
        labelKey: settings.usageMonitoring
        tier: recommended
        onKeys: []
        members:
          - id: glmPlanUsage
            labelKey: settings.glmPlanUsage
            tier: recommended
          - id: opencodeGoUsage
            labelKey: settings.opencodeGoUsage
            # 任务 783 定的 unstable→recommended（「编辑读回 tier 未稳定→推荐」），
            # 内置默认已翻、本 yaml 漏翻——tl1286 预存红顺手对齐。
            tier: recommended
      # tl 1097：日志管理——kind:param 参数卡（无开关）。两个 segment 档位
      # （告警日志保留时间 + 空间上限）+ 当前占用行 + 打开日志目录按钮；
      # 全量日志不受此卡影响（固定 25 份 ≈ 2 天）。775 参数卡基建同款。
      - id: logManagement
        labelKey: settings.logManagement
        kind: param
        tier: optional
        onKeys: []
        fields:
          - id: alertLogRetentionDays
            input: segment
          - id: alertLogMaxTotalMB
            input: segment

  # ── 开发调试（1 项）─────────────────────────────────────────
  - key: dev-debug
    labelKey: settings.labGroup.devDebug
    entries:
      - id: devDebug
        labelKey: settings.devDebug
        onKeys: [experimentalCDPDebugPort, experimentalLifecycleNoiseGate]
        members:
          - id: cdpDebugPort
            labelKey: settings.cdpDebugPort
            # tl1487 五组：CDP 调试端口未稳定→稳定（用户 20261107 八组清单；
            # 默认关语义不变——稳定档在此只表达成熟度，pane 开关不接
            # labStableLocked，与 sessionStorage tl1338 特例同口径）。
            tier: stable
          - id: lifecycleNoiseGate
            labelKey: settings.lifecycleNoiseGate
            tier: unstable

  # ── 存储（3 项；任务 775：闲置释放/内存上限两参数卡迁入；tl-1174 增冷压缩；
  #    tl1287：DAG 迁移卡转正迁出——改宿主会话存储卡，不再占实验室 rail；
  #    tl1309 卡③：GC 策略/闲置释放两参数卡迁出——入基础设施组「资源治理」卡；
  #    tl1337 返修：条目归属按功能域对齐（任务书 20261101 21:2x 口径）——存储域
  #    =会话存储/数据目录/存储版本/迁移项：存储版本与迁移/备份清理作为会话存储
  #    卡（sessionStore）卡内子项（pane 内左文右操作行，归属即在本卡）；数据
  #    目录（homePointer，向导面独立 pane）与冷压缩（jsonlZstd）维持域内独立卡，
  #    本组归属已按功能域成立，无需成员搬移）──
  - key: storage
    labelKey: settings.labGroup.storage
    entries:
      - id: sessionStore
        labelKey: settings.sessionStore
        # tl1309 卡②：eventsRotation（events 瘦身）迁出本卡成员表，入可观测
        # 性组「运行可观测」卡——存储档位面（sessionStorage）留本卡；灯键
        # eventsRotationNonDefault 随迁出。
        # tl1338（用户 2026-11-01 拍板）：sessionStorage 未稳定→稳定——本 fork
        # 已锁定 v3（916），卡内其余条目（v4/v5 迁移、扫描清理）均为迁移操作
        # 工具而非实验能力，不该挂未稳定徽章。容器档=成员最高档：未稳定→稳定
        # （导航 rail 与卡头徽章同源 labEntryBadgeTier，随之联动）。
        onKeys: [sessionStorageNonDefault]
        members:
          - id: sessionStorage
            labelKey: settings.sessionStorage
            tier: stable
      # 任务 846：配置数据目录可更改（未稳定档，默认关）。独立卡+独立 pane
      # （向导在 SettingsPanel 的 homePointer 分支，HomePointerLabPane）。
      - id: homePointer
        labelKey: settings.homePointer
        tier: unstable
        onKeys: [homePointer]
      # tl-1174：冷会话主转录整文件 zstd 压缩（可选档，默认关）。热会话保持
      # 明文；冷会话整文件压缩为 .jsonl.zst；冷读透明解压；恢复活跃时物化回
      # 明文。开关关=会话文件与引入前逐字节一致（铁律 2）。空闲 sweep 每 tick
      # 现读开关（921 先例），保存即生效免重启。
      - id: jsonlZstd
        labelKey: settings.jsonlZstd
        # tl1487 六组：冷会话归档（zstd）可选→推荐（用户 20261107 八组清单）。
        tier: recommended
        onKeys: [experimentalJsonlZstd]
      # tl1309 卡③：GC 策略（tl1286）与闲置释放（775）两参数卡迁出本组——
      # 入基础设施组「资源治理」卡成员行（同为内存/资源生命周期面；字段绑定
      # 仍在 labParamFields 注册表，配置键/setter 零变化）。

  # ── 基础设施（3 项；任务 785：S1 常驻底座开关条目随底座退役移除；
  #    任务 992：工具优化整体并入本组，原独立 tool-opt 组退役；tl1309 卡③：
  #    复用池/孤儿回收/ACP 监听/本地服务 + GC 策略/闲置释放（自存储组迁入）
  #    六项并「资源治理」卡）──
  - key: infra
    labelKey: settings.labGroup.infra
    entries:
      # tl1309 卡③：资源治理（合并卡，742/782/961 条目级合并先例）——运行时
      # 复用池 + 孤儿回收 + ACP 常驻监听 + 本地服务四散条，加 GC 策略与闲置
      # 释放两参数卡（自存储组迁入，字段绑定仍在 labParamFields，值语义单源）
      # 六成员并卡（任务书③：同为内存/资源生命周期面）。容器档 = 成员最高档
      # （复用池稳定 → 稳定）；卡内各行各读各的键、各写各的 setter，配置键
      # 零变化，已存偏好零迁移。
      - id: resourceGovernance
        labelKey: settings.resourceGovernance
        tier: stable
        onKeys: [experimentalRuntimeReuse, experimentalOrphanHandling, experimentalACPListen, experimentalLocalServer]
        members:
          # 运行时复用池（原 infra 独立卡，稳定档，1005 批1 转档）。
          - id: runtimeReuse
            labelKey: settings.runtimeReuse
            tier: stable
          # 孤儿资源回收清理（原 infra 独立卡，推荐档——992 随复用池升推荐）。
          - id: orphanHandling
            labelKey: settings.orphanHandling
            tier: recommended
          # 后台会话闲置释放（原存储组 kind:param 参数卡，775 首批；推荐档）。
          - id: idleReleaseMinutes
            labelKey: settings.detachedIdleRelease
            tier: recommended
          # GC 策略旋钮（原存储组 kind:param 参数卡，tl1286）。
          # tl1487 七组①：可选→推荐，建议值 100（用户 20261107 八组清单；
          # 显示层 gcPercentForView 已把 0=跟随默认渲染为等效 100）。
          - id: gcPercent
            labelKey: settings.gcPercent
            tier: recommended
          # ACP 常驻监听（原 infra 独立卡，未稳定档，790）。
          - id: acpListen
            labelKey: settings.acpListen
            tier: unstable
          # 本地服务（原 infra 独立卡；tl1265 第2轮 2026-11-13 拍板：未稳定→可选）。
          - id: localServer
            labelKey: settings.localServer
            tier: optional
      # tl134/tl1487 七组③：路径规则整卡移除——结构化路径作用域判定为过时
      # 技术（zh 文案自证「未接线：开关开/关均无效果」，生产走 confine+
      # allow_write+写入审批），用户 20261107 20:17 裁决移除；机制存档见
      # docs/archive/路径作用域规则tl134-机制存档-20261107.md。loader
      # （internal/rules）测试在跑，代码按最小改动保留，只撤配置面。
      # 任务 992（用户 1018 21:34 拍板）：工具优化整体合并到基础设施组（原
      # 独立 tool-opt 组退役）；restartUpdate 归位回界面组 updateFeedback 卡
      # （本文件随 1005 一并补同步——卡灯三键，restartUpdate 不再入灯/入卡）。
      # 任务 783④：编辑读回（readBack）随 22.5 交付转正——未稳定→推荐。
      # 任务 943：本卡只管 readBack 面（789 证据门联动成员行随卡）。
      # 任务 979：capabilityGroups（能力组披露+session_hub 聚合件，953/954/955
      # 共用一键）成员行入卡，卡灯第三键。
      - id: toolOptimizations
        labelKey: settings.toolOptHub
        tier: recommended
        onKeys: [experimentalToolOptimizations, experimentalMultiEditInjection, experimentalCapabilityGroups]
        # tl1487 七组②：工具优化五项（编辑证据门宽松/multi_edit 直注、能力组
        # 披露与 session_hub 聚合、multi_edit 错误详情、证据门连坐收窄、跳过
        # 失败项）全部可选→推荐（用户 20261107 八组清单）。
        members:
          # 任务 789/992：编辑证据门宽松模式。
          - id: editEvidenceRelaxed
            labelKey: settings.editEvidenceRelaxed
            tier: recommended
          # 任务 943：multi_edit 直注（原族卡第二效果拆出）。
          - id: multiEditInjection
            labelKey: settings.multiEditInjection
            tier: recommended
          # 任务 979：能力组披露+session_hub 聚合件（953/954/955 共用一键，
          # 默认关=零行为，重启生效）。
          - id: capabilityGroups
            labelKey: settings.capabilityGroups
            tier: recommended
          # tl-1218：multi_edit 三条增强（各自独立开关，默认关重启生效）。
          - id: multiEditErrorDetail
            labelKey: settings.multiEditErrorDetail
            tier: recommended
          - id: multiEditEvidenceNarrow
            labelKey: settings.multiEditEvidenceNarrow
            tier: recommended
          - id: multiEditSkipFailed
            labelKey: settings.multiEditSkipFailed
            tier: recommended

