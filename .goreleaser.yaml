# 状态（tl1825 2026-11-26）：本文件是 CLI 发布恢复通道的配置（上游继承），唯一消费方 = .github/workflows/release.yml，其 workflow_dispatch 仅限官方恢复用途，fork 日常严禁误触发。
# fork 日常不单独发 CLI、不走 goreleaser：CLI 产物走 scripts/fork-release.sh 本地构建（unsigned），fork 发布走 release-fork.yml（desktop，nfpm 打包，非 goreleaser）。
# 启用条件 = 仅当需要恢复/重建 CLI 官方发布通道时；注意其 homebrew tap 指向 esengine/homebrew-reasonix（上游资源，需 HOMEBREW_TAP_TOKEN），与宪法「独立演进」口径冲突，启用前须先解决。
version: 2
project_name: reasonix

before:
  hooks:
    - go mod download

builds:
  - id: reasonix
    main: ./cmd/reasonix
    binary: reasonix
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Inject version identity for `reasonix version --verbose/--json` (Integration D/E).
      # buildTimeUTC is the goreleaser run time (UTC), not vcs.time.
      - -s -w -X main.version={{ .Tag }} -X main.gitCommit={{ .ShortCommit }} -X main.buildTimeUTC={{ .Date }} -X reasonix/internal/productdocs.linkedVersion={{ .Tag }} -X reasonix/internal/productdocs.linkedRevision={{ .Commit }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: reasonix
    ids: [reasonix]
    name_template: "reasonix-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

homebrew_casks:
  - name: reasonix
    ids: [reasonix]
    # Prereleases (including v*-preview.* and v*-rc*) must not update the stable
    # tap; brew has no separate prerelease channel, so uploading either cask
    # would make it the default `brew install`.
    # npm is a separate line (release-npm.yml, `npm-v*`), so an npm prerelease no
    # longer drags brew along — a stable `v*` cask can ship while npm stays on rc.
    skip_upload: "auto"
    repository:
      owner: esengine
      name: homebrew-reasonix
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/esengine/DeepSeek-Reasonix"
    description: "Cache-first DeepSeek coding agent for the terminal."
    commit_author:
      name: reasonix
      email: reasonix@deepseek.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/reasonix"]
          end

release:
  prerelease: auto
  make_latest: false
  name_template: "Reasonix CLI {{ .Tag }}"
