# gitleaks configuration (task 219 P0).
#
# Extends the built-in rules and silences the findings the 2026-09-22 full
# history scan (9701 commits, 1.23 GB) classified as false positives. Every
# entry below is backed by an inspected example — nothing is blanket-ignored
# because it was noisy:
#
#   - *_test.go / *.test.ts / *.test.tsx / crates tests: fixtures that build
#     their own throwaway keys at runtime (e.g. crash-report's firebase tests
#     generate an RSA pair with crypto.subtle and wrap it in a PEM header,
#     which the private-key rule cannot tell from a real service account).
#   - wt1/**: a historical in-tree worktree snapshot kept for reference; its
#     findings duplicate the same fixture patterns one level deeper.
#   - reasonix-serve-caps-*: the serve capability revision string in
#     internal/remote/bootstrap/launch.go — a wire-contract version label,
#     not a credential.
#
# New secrets in real sources still trip the default rules. Re-run the full
# scan after changing this file:
#   gitleaks detect --source . --report-path <file> --redact

[extend]
useDefault = true

[allowlist]
description = "task 219 P0 baseline: inspected false positives (2026-09-22)"
paths = [
  '''_test\.go$''',
  '''\.test\.tsx?$''',
  '''^wt1/''',
  '''^crates/reasonix-render/tests/''',
  '''^workers/crash-report/src/.*\.test\.ts$''',
  '''^src/config\.ts$''',
]
regexes = [
  '''reasonix-serve-caps-''',
]
