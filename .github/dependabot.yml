version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pi-catalog:
        patterns: ["github.com/sky-valley/pi"]
        update-types: ["minor", "patch"]
      go:
        patterns: ["*"]
        exclude-patterns: ["github.com/sky-valley/pi"]
        update-types: ["minor", "patch"]
    # tl1700: pi 锁在 v0.99.26，不放 1.x。
    # pi 1.x 把 opencode-go 目录的 baseUrl 从 https://opencode.ai/zen/go/v1 迁到
    # https://opencode.ai/inference/go/openai/v1（anthropic 路由同理迁到
    # https://opencode.ai/inference/go/anthropic），而 internal/provider/opencode_go.go
    # 把官方路由硬编码成 /zen/go/v1 与 /zen/go、pi_catalog.go 又按这组 baseUrl 精确匹配
    # 目录条目——两者一旦对不上，OpenCode Go 的模型表、上下文上限/最大输出与视觉模型识别
    # 会整体失效，而 go build 仍能通过（属静默行为回退）。
    # 实测：fork 自带的 internal/provider 契约测试在 v0.99.26 全绿，升到 v1.5.31 挂 4 个
    # （TestOpenCodeGoChatModelsMatchPinnedLimits 等，见 PR #99 评估）。
    # 待 fork 适配新路由后再放开 1.x。
    ignore:
      - dependency-name: "github.com/sky-valley/pi"
        versions: [">=1.0.0"]

  - package-ecosystem: "gomod"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/desktop/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 任务 1270（2026-10-30 用户裁断，沿用 555 workers 先例）：site/ 目录是上游遗留
  # astro 站（fork 已用 docs-site 替代，不在维护面）——禁用其全部依赖更新
  # （open-pull-requests-limit: 0 + ignore "*"），已开的 site PR 一并关闭。
  # 注意：security alerts 由仓库依赖图扫描产生，本配置不能移除已存在的 alerts；
  # 如需清除现存告警需在 GitHub UI 逐条 dismiss（任务纪律禁止脚本 dismiss）。
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # 任务 555（2026-10-06 用户裁断）：workers/{accounts,crash-report,forum} 三目录不在维护范围，
  # 显式登记并禁用其全部依赖更新（open-pull-requests-limit: 0 禁版本/安全更新 PR；
  # ignore "*" 忽略所有依赖），不留 Dependabot 更新入口。
  # 注意：security alerts 由仓库依赖图扫描产生，本配置不能移除已存在的 alerts；
  # 如需清除现存告警需在 GitHub UI 逐条 dismiss（任务纪律禁止脚本 dismiss）。
  - package-ecosystem: "npm"
    directory: "/workers/accounts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "npm"
    directory: "/workers/crash-report"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "npm"
    directory: "/workers/forum"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
