name: Bug report
description: Report a bug in DeepSeek-Reasonix (fork)
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This fork ships **Windows 11/10 (amd64) desktop** only. For other platforms,
        please file at the upstream repository instead.
  - type: input
    id: version
    attributes:
      label: Exact version
      description: Output of `reasonix --version`.
      placeholder: e.g. 1.34.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / platform
      description: This fork targets Windows amd64 desktop only.
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any error output here.
